          python3 -m py_compile "$RUNNER_TEMP/mobile.py"
          python3 "$RUNNER_TEMP/mobile.py"

          test -f app/src/main/java/com/nuvio/tv/afplay/AfPlayMobileGateActivity.kt
          grep -F 'afplay-gateway.smar7y.workers.dev' app/src/main/java/com/nuvio/tv/afplay/AfPlayMobileGateActivity.kt
          grep -F 'AfPlayMobileGateActivity' app/src/main/java/com/nuvio/tv/launcher/AppIconActivities.kt

      - name: Build
        env:
          CI_USE_DEBUG_SIGNING: 'false'
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon --console=plain

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          DIR="app/build/outputs/apk/full/debug"
          APK="$(find "$DIR" -maxdepth 1 -type f -name '*universal*debug*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" out/AF-Play-Mobile-v6.6.apk
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: AF-Play-Mobile-v6.6
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
