      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.app.versionName="0.6.3" --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-0.6.3-FileList-Test-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AF-Play-0.6.3-FileList-Test-arm64
          path: out/AF-Play-0.6.3-FileList-Test-arm64.apk
          if-no-files-found: error
          retention-days: 14
