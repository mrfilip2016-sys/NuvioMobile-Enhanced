name: AF Play Mobile 0.6.3 FileList Test

on:
  workflow_dispatch: {}
  push:
    branches: [enhanced]
    paths:
      - '.github/workflows/af-play-mobile-063-filelist-test.yml'

permissions:
  contents: read

concurrency:
  group: af-play-mobile-063-filelist-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AF Play Mobile FileList Test
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout AF Play 0.6.3
        uses: actions/checkout@v6
        with:
          ref: af-play
          fetch-depth: 0
          submodules: false

      - name: Fetch working portrait workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin enhanced:refs/remotes/origin/enhanced --force
          git show origin/enhanced:.github/workflows/af-play-mobile-063-portrait-activation.yml > "$RUNNER_TEMP/portrait.yml"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Apply working portrait and activation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re
          text = (Path(os.environ["RUNNER_TEMP"]) / "portrait.yml").read_text(encoding="utf-8")
          m = re.search(r'''cat > "\$RUNNER_TEMP/afplay_portrait_patch\.b64" <<'PATCH64'\n(.*?)\n\s*PATCH64''', text, flags=re.S)
          if not m:
              raise SystemExit("Portrait patch not found")
          data = base64.b64decode("".join(x.strip() for x in m.group(1).splitlines()), validate=True)
          out = Path(os.environ["RUNNER_TEMP"]) / "portrait_patch.py"
          out.write_bytes(data)
          compile(data.decode("utf-8"), str(out), "exec")
          PY
          python3 "$RUNNER_TEMP/portrait_patch.py"

