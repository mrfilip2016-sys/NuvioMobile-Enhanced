      - name: Verify integration
        shell: bash
        run: |
          set -euo pipefail
          A="composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/FileListTrialSection.android.kt"
          C="composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/FileListTrialSection.kt"
          I="composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/IntegrationsSettingsPage.kt"
          test -f "$A"
          test -f "$C"
          grep -F 'FileList Test' "$A"
          grep -F 'Test conexiune' "$A"
          grep -F 'Authorization' "$A"
          grep -F 'FileListTrialSection(isTablet = isTablet)' "$I"
          grep -F 'CURRENT_PROJECT_VERSION=266' iosApp/Configuration/Version.xcconfig
          chmod +x gradlew

