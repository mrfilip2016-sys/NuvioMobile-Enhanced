name: AF Play Mobile v6.6

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          cat > local.properties <<'EOF'
          TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
          SIMKL_APP_NAME=afplay
          USE_LOCAL_FFMPEG_DECODER=false
          DOVI_NATIVE_ENABLED=false
          DOVI_EXTRACTOR_HOOK_READY=false
          DOVI_ENABLE_REAL_LINK=false
          SUPPORTERS_API_BASE_URL=https://nuvio.tv/
          SUPPORT_URL=https://nuvio.tv/support
          EOF
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> local.properties
          touch local.dev.properties

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/afplay-mobile.jks" \
            -storepass android \
            -alias afplaymobile \
            -keypass android \
            -dname "CN=AF Play Mobile,O=AF Studio,C=IT" \
            -keyalg RSA -keysize 2048 -validity 10000

          echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/afplay-mobile.jks" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_ALIAS=afplaymobile" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Apply AF Play v6.2 base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re
          src = Path(".github/workflows/af-play-tv-full-v6.2.yml").read_text(encoding="utf-8")
          m = re.search(
              r'''cat > "\$RUNNER_TEMP/afplay_tv_patch\.b64" <<'AFPLAY_PATCH'\n(.*?)\n\s*AFPLAY_PATCH''',
              src,
              flags=re.S,
          )
          if not m:
              raise SystemExit("Patch v6.2 not found")
          raw = "".join(x.strip() for x in m.group(1).splitlines())
          data = base64.b64decode(raw, validate=True)
          p = Path(os.environ["RUNNER_TEMP"]) / "base.py"
          p.write_bytes(data)
          compile(data.decode("utf-8"), str(p), "exec")
          PY
          python3 "$RUNNER_TEMP/base.py"

