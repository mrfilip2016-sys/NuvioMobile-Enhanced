name: AF Play v0.6.3 Nuvio Cynex RO Cast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Load latest preset2
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/afplay-user-preset.json
          python3 -m json.tool /tmp/afplay-user-preset.json >/dev/null
          test -s /tmp/afplay-user-preset.json

      - name: Apply AF Play v0.6.2 update
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/afplay_v062_patch.py
          python3 /tmp/afplay_v062_patch.py


      - name: Add Google Cast to AF Play player
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/afplay_cast_patch.py
          python3 /tmp/afplay_cast_patch.py

      - name: Verify v0.6.3
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'All-in-One-Nuvio' composeApp/src/androidMain/assets/afplay-preset.json
          grep -F 'All-in-One-Cynex' composeApp/src/androidMain/assets/afplay-preset.json
          grep -F 'NiakVIO' composeApp/src/androidMain/assets/afplay-preset.json
          grep -F 'afPlayPluginPriority' composeApp/src/commonMain/kotlin/com/nuvio/app/features/streams/StreamAutoPlaySelector.kt
          grep -F 'subtitleLanguageKey(subtitle.language) == "ro"' composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/SubtitleRepository.kt
          grep -F 'LiveTvCategoryCardsRow(' composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvScreen.kt
          grep -F 'MARKETING_VERSION=0.6.3' iosApp/Configuration/Version.xcconfig
          grep -F 'CURRENT_PROJECT_VERSION=263' iosApp/Configuration/Version.xcconfig
          grep -F 'play-services-cast-framework:22.3.1' composeApp/build.gradle.kts
          grep -F 'OPTIONS_PROVIDER_CLASS_NAME' androidApp/src/main/AndroidManifest.xml
          grep -F 'AfPlayCastButton(' composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerControls.kt
          grep -F 'castMediaUrl = afPlayCastMediaUrl' composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerScreenRuntimeUi.kt

      - name: Commit AF Play v0.6.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            composeApp/src/androidMain/assets/afplay-preset.json \
            composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/streams/StreamAutoPlaySelector.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/SubtitleRepository.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvScreen.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerControls.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerScreenRuntimeUi.kt \
            composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/AfPlayCastButton.kt \
            composeApp/src/androidMain/kotlin/com/nuvio/app/features/player/AfPlayCastButton.android.kt \
            composeApp/src/iosMain/kotlin/com/nuvio/app/features/player/AfPlayCastButton.ios.kt \
            composeApp/build.gradle.kts \
            androidApp/src/main/AndroidManifest.xml \
            iosApp/Configuration/Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "AF Play 0.6.3: Nuvio Cynex priority, Romanian subtitles and TV categories"
            git push origin HEAD:af-play
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable AF Play signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play v0.6.3
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.app.versionName="0.6.3" \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-v0.6.3-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-v0.6.3-arm64
          path: out/AF-Play-v0.6.3-arm64-v8a-debug.apk
          if-no-files-found: error
