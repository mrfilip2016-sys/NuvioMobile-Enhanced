name: AF Play Stable Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent AF Play debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if this is the first stable build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi
          echo "AF Play signing certificate:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA256:|Owner:' || true

      - name: Set unique version
        shell: bash
        run: |
          set -euo pipefail
          build_code=$((200 + GITHUB_RUN_NUMBER))
          sed -i -E "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${build_code}/" iosApp/Configuration/Version.xcconfig
          echo "VERSION_CODE=${build_code}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play native APK
        shell: bash
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.app.versionName="0.3.${GITHUB_RUN_NUMBER}" \
            --stacktrace

      - name: Collect arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-Stable-arm64-v8a-debug.apk

      - name: Upload AF Play APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-Stable-arm64
          path: out/AF-Play-Stable-arm64-v8a-debug.apk
          if-no-files-found: error
