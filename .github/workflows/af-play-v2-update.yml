name: AF Play v2 Branding + Live TV Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AF Play branch
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply AF Play v2 patch
        shell: bash
        env:
          AF_PLAY_PATCH_B64: ""
          AF_PLAY_LOGO_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path("/tmp/af_play_v2_patch.py").write_bytes(base64.b64decode(os.environ["AF_PLAY_PATCH_B64"]))
          PY
          python3 /tmp/af_play_v2_patch.py

      - name: Commit changes
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: AF Play branding and Live TV card grid"
            git push origin af-play
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play v0.2 APK
        shell: bash
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.app.versionName=0.2.0 \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-v0.2-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-v0.2-Native-arm64
          path: out/AF-Play-v0.2-arm64-v8a-debug.apk
          if-no-files-found: error
