name: AF Play v0.6.0 Direct Start Top 10 IMDb

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Install supplied AF Play preset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p composeApp/src/androidMain/assets
          echo '' | base64 -d > composeApp/src/androidMain/assets/afplay-preset.json
          python3 -m json.tool composeApp/src/androidMain/assets/afplay-preset.json >/dev/null
          test -s composeApp/src/androidMain/assets/afplay-preset.json

      - name: Apply AF Play v0.6.0 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/afplay_v060_patch.py
          python3 /tmp/afplay_v060_patch.py

      - name: Verify requested changes
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AF_PLAY_DEFAULT_USER_ID' composeApp/src/commonMain/kotlin/com/nuvio/app/core/auth/AuthRepository.kt
          grep -F 'createAfPlayDefaultProfile' composeApp/src/commonMain/kotlin/com/nuvio/app/features/profiles/ProfileRepository.kt
          grep -F 'pendingExportPayload' composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt
          grep -F 'imdbRating = item.imdbRating' composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomePosterCard.kt
          grep -F 'Top 10 Filme' composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeCatalogSection.kt
          grep -F 'Top 10 Seriale' composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeCatalogSection.kt
          grep -F 'MARKETING_VERSION=0.6.0' iosApp/Configuration/Version.xcconfig
          grep -F 'CURRENT_PROJECT_VERSION=260' iosApp/Configuration/Version.xcconfig
          test -s composeApp/src/androidMain/assets/afplay-preset.json

      - name: Commit AF Play v0.6.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             composeApp/src/androidMain/assets/afplay-preset.json             composeApp/src/commonMain/kotlin/com/nuvio/app/core/auth/AuthRepository.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/AppGate.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/features/profiles/ProfileRepository.kt             composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/core/ui/ShelfComponents.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomePosterCard.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeCatalogSection.kt             iosApp/Configuration/Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "AF Play 0.6.0: direct start, IMDb, Top 10 and preset"
            git push origin HEAD:af-play
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable AF Play signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play v0.6.0
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.6.0"             --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-v0.6.0-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-v0.6.0-arm64
          path: out/AF-Play-v0.6.0-arm64-v8a-debug.apk
          if-no-files-found: error
