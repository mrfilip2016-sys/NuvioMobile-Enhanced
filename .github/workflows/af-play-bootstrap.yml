name: AF Play Bootstrap + Native APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout enhanced
        uses: actions/checkout@v4
        with:
          ref: enhanced
          fetch-depth: 0
          submodules: false

      - name: Create AF Play branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C af-play

      - name: Apply AF Play native changes
        shell: python
        run: |
          from pathlib import Path

          ROOT = Path(".")

          def replace(path, old, new, required=True):
              p = ROOT / path
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  if required:
                      raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
                  return
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Branding + package
          replace("androidApp/build.gradle.kts",
                  'namespace = "com.nuvio.android"',
                  'namespace = "app.afplay.mobile"')
          replace("androidApp/build.gradle.kts",
                  'applicationId = "com.nuvio.media"',
                  'applicationId = "app.afplay.mobile"')
          replace("androidApp/build.gradle.kts",
                  'variant.applicationId.set("com.nuviodebug.com")',
                  'variant.applicationId.set("app.afplay.mobile.debug")')

          # arm64 only
          old_splits = (
              'isEnable = buildsReleaseApks\n'
              '            reset()\n'
              '            include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")\n'
              '            isUniversalApk = false'
          )
          new_splits = (
              'isEnable = true\n'
              '            reset()\n'
              '            include("arm64-v8a")\n'
              '            isUniversalApk = false'
          )
          replace("androidApp/build.gradle.kts", old_splits, new_splits)

          # App name
          for rel in [
              "composeApp/src/androidMain/res/values/strings.xml",
              "androidApp/src/debug/res/values/strings.xml",
          ]:
              p = ROOT / rel
              if p.exists():
                  p.write_text(
                      p.read_text(encoding="utf-8").replace("Nuvio Enhanced", "AF Play"),
                      encoding="utf-8",
                  )

          # Live TV UI wording
          p = ROOT / "composeApp/src/commonMain/composeResources/values/strings.xml"
          t = p.read_text(encoding="utf-8")
          t = t.replace("Nuvio Enhanced", "AF Play")
          t = t.replace("Add M3U playlists for live channels.",
                        "Add M3U or AF Play JSON sources for live channels.")
          t = t.replace("M3U playlists", "M3U / JSON sources")
          t = t.replace("Add local M3U", "Add local M3U / JSON")
          t = t.replace("Local M3U file", "Local M3U / JSON file")
          t = t.replace("Stored local M3U content", "Stored local M3U / JSON content")
          p.write_text(t, encoding="utf-8")

          # JSON file picker
          p = ROOT / "composeApp/src/androidMain/kotlin/com/nuvio/app/features/livetv/LiveTvPlaylistFilePicker.android.kt"
          t = p.read_text(encoding="utf-8")
          t = t.replace(
              '"text/plain",\n                    "application/octet-stream",',
              '"text/plain",\n                    "application/json",\n                    "text/json",\n                    "application/octet-stream",'
          )
          p.write_text(t, encoding="utf-8")

          # Native JSON TV parser
          p = ROOT / "composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt"
          t = p.read_text(encoding="utf-8")

          if "import kotlinx.serialization.Serializable" not in t:
              t = t.replace(
                  "import kotlinx.coroutines.withContext\n",
                  "import kotlinx.coroutines.withContext\n"
                  "import kotlinx.serialization.Serializable\n"
                  "import kotlinx.serialization.json.Json\n"
              )

          t = t.replace("parseM3uPlaylist(payload, playlist)",
                        "parseLiveTvPayload(payload, playlist)")

          marker = "internal fun parseM3uPlaylist(\n"
          if "internal fun parseLiveTvPayload(" not in t:
              idx = t.find(marker)
              if idx < 0:
                  raise SystemExit("parseM3uPlaylist marker not found")

              block = (
                  '\nprivate val afPlayLiveTvJson = Json {\n'
                  '    ignoreUnknownKeys = true\n'
                  '    isLenient = true\n'
                  '}\n\n'
                  '@Serializable\n'
                  'private data class AfPlayTvRoot(\n'
                  '    val channels: List<AfPlayTvChannel> = emptyList(),\n'
                  ')\n\n'
                  '@Serializable\n'
                  'private data class AfPlayTvChannel(\n'
                  '    val id: String? = null,\n'
                  '    val channelName: String = "",\n'
                  '    val channelImage: String? = null,\n'
                  '    val channelLinks: List<AfPlayTvLink> = emptyList(),\n'
                  ')\n\n'
                  '@Serializable\n'
                  'private data class AfPlayTvLink(\n'
                  '    val quality: String? = null,\n'
                  '    val playerType: String? = null,\n'
                  '    val url: String = "",\n'
                  '    val contentHost: String? = null,\n'
                  ')\n\n'
                  'internal fun parseLiveTvPayload(\n'
                  '    payload: String,\n'
                  '    playlist: LiveTvPlaylist? = null,\n'
                  '): List<LiveTvChannel> {\n'
                  '    val trimmed = payload.trimStart()\n'
                  '    return if (trimmed.startsWith("{")) {\n'
                  '        parseAfPlayJsonPlaylist(payload, playlist)\n'
                  '    } else {\n'
                  '        parseM3uPlaylist(payload, playlist)\n'
                  '    }\n'
                  '}\n\n'
                  'private fun parseAfPlayJsonPlaylist(\n'
                  '    payload: String,\n'
                  '    playlist: LiveTvPlaylist? = null,\n'
                  '): List<LiveTvChannel> {\n'
                  '    val root = afPlayLiveTvJson.decodeFromString<AfPlayTvRoot>(payload)\n'
                  '    return root.channels.mapIndexedNotNull { index, channel ->\n'
                  '        val safeLink = channel.channelLinks.firstOrNull { link ->\n'
                  '            val url = link.url.trim()\n'
                  '            url.isNotBlank() && !url.contains("decryption_key=", ignoreCase = true)\n'
                  '        } ?: return@mapIndexedNotNull null\n'
                  '        val streamUrl = safeLink.url.trim()\n'
                  '        LiveTvChannel(\n'
                  '            id = channel.id?.trim()?.takeIf(String::isNotBlank)\n'
                  '                ?: stableChannelId(streamUrl, index),\n'
                  '            name = channel.channelName.trim().ifBlank { "Channel" },\n'
                  '            streamUrl = streamUrl,\n'
                  '            logoUrl = channel.channelImage?.trim()?.takeIf(String::isNotBlank),\n'
                  '            playlistId = playlist?.id,\n'
                  '            playlistName = playlist?.name,\n'
                  '            streamType = safeLink.playerType?.trim()?.takeIf(String::isNotBlank),\n'
                  '        )\n'
                  '    }.distinctBy { it.streamUrl }\n'
                  '}\n\n'
              )
              t = t[:idx] + block + t[idx:]

          p.write_text(t, encoding="utf-8")

          # Simple AF Play adaptive icon
          colors = ROOT / "composeApp/src/androidMain/res/values/colors.xml"
          if colors.exists():
              ct = colors.read_text(encoding="utf-8")
              ct = ct.replace(
                  '<color name="app_icon_background">#000000</color>',
                  '<color name="app_icon_background">#6D28D9</color>'
              )
              colors.write_text(ct, encoding="utf-8")

          draw = ROOT / "composeApp/src/androidMain/res/drawable"
          draw.mkdir(parents=True, exist_ok=True)
          (draw / "af_play_launcher_foreground.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<vector xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:width="108dp"\n'
              '    android:height="108dp"\n'
              '    android:viewportWidth="108"\n'
              '    android:viewportHeight="108">\n'
              '    <path android:fillColor="#FFFFFFFF"\n'
              '        android:pathData="M42,30 L42,78 L78,54 Z" />\n'
              '</vector>\n',
              encoding="utf-8"
          )

          for rel in [
              "composeApp/src/androidMain/res/mipmap-anydpi-v26/ic_launcher.xml",
              "composeApp/src/androidMain/res/mipmap-anydpi-v26/ic_launcher_round.xml",
          ]:
              ip = ROOT / rel
              if ip.exists():
                  x = ip.read_text(encoding="utf-8")
                  x = x.replace('@mipmap/ic_launcher_foreground',
                                '@drawable/af_play_launcher_foreground')
                  x = x.replace('@mipmap/ic_launcher_monochrome',
                                '@drawable/af_play_launcher_foreground')
                  ip.write_text(x, encoding="utf-8")

      - name: Add AF Play build workflow to branch
        shell: bash
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/af-play-android.yml <<'YAML'
          name: AF Play Native Android
          on:
            workflow_dispatch:
            push:
              branches: [af-play]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    submodules: false
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: gradle/actions/setup-gradle@v4
                - run: chmod +x gradlew
                - name: Build arm64 debug APK
                  run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.app.versionName=0.1.0 --stacktrace
                - name: Collect APK
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p out
                    apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
                    test -n "$apk"
                    cp "$apk" out/AF-Play-arm64-v8a-debug.apk
                - uses: actions/upload-artifact@v4
                  with:
                    name: AF-Play-Native-arm64
                    path: out/AF-Play-arm64-v8a-debug.apk
          YAML

      - name: Commit and push af-play
        shell: bash
        run: |
          git add -A
          git commit -m "feat: bootstrap AF Play native Android"
          git push -u origin af-play --force-with-lease

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build first AF Play test APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.app.versionName=0.1.0 \
            --stacktrace

      - name: Collect first APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-arm64-v8a-debug.apk

      - name: Upload AF Play APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-Native-arm64
          path: out/AF-Play-arm64-v8a-debug.apk
          if-no-files-found: error
