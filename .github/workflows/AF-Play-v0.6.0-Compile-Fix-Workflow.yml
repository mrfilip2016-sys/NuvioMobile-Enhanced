name: AF Play v0.6.0 Compile Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Fix Top 10 compile error
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeCatalogSection.kt")
          t = p.read_text(encoding="utf-8")

          required_import = "import androidx.compose.foundation.layout.Box\n"
          if required_import not in t:
              anchor = "import androidx.compose.foundation.layout.BoxWithConstraints\n"
              if anchor not in t:
                  raise SystemExit("HomeCatalogSection BoxWithConstraints import not found")
              t = t.replace(anchor, required_import + anchor, 1)

          p.write_text(t, encoding="utf-8")
          print("Added missing Box import")
          PY

      - name: Verify v0.6.0 source
        shell: bash
        run: |
          set -euo pipefail
          FILE="composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeCatalogSection.kt"
          grep -F 'import androidx.compose.foundation.layout.Box' "$FILE"
          grep -F '"Top 10 Filme"' "$FILE"
          grep -F '"Top 10 Seriale"' "$FILE"
          grep -F 'imdbRating = item.imdbRating' composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomePosterCard.kt
          grep -F 'AF_PLAY_DEFAULT_USER_ID' composeApp/src/commonMain/kotlin/com/nuvio/app/core/auth/AuthRepository.kt
          grep -F 'pendingExportPayload' composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt
          grep -F 'MARKETING_VERSION=0.6.0' iosApp/Configuration/Version.xcconfig
          grep -F 'CURRENT_PROJECT_VERSION=260' iosApp/Configuration/Version.xcconfig

      - name: Commit compile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/home/components/HomeCatalogSection.kt
          if ! git diff --cached --quiet; then
            git commit -m "AF Play 0.6.0: fix Top 10 Box import"
            git push origin HEAD:af-play
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable AF Play signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play v0.6.0
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.6.0"             --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-v0.6.0-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-v0.6.0-arm64
          path: out/AF-Play-v0.6.0-arm64-v8a-debug.apk
          if-no-files-found: error
