name: AF Play Mobile 0.6.3 + Activation

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: af-play-mobile-063-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AF Play Mobile 0.6.3 Activation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout AF Play 0.6.3
        uses: actions/checkout@v6
        with:
          ref: af-play
          fetch-depth: 1
          submodules: false

      - name: Verify AF Play 0.6.3 base
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MARKETING_VERSION=0.6.3' iosApp/Configuration/Version.xcconfig
          grep -F 'CURRENT_PROJECT_VERSION=263' iosApp/Configuration/Version.xcconfig
          grep -F 'applicationId = "app.afplay.mobile"' androidApp/build.gradle.kts
          test -f composeApp/src/androidMain/kotlin/com/nuvio/app/MainActivity.kt
          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable AF Play debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create stable signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Prepare local properties
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties

      - name: Add activation gate only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/afplay_activation_patch.b64" <<'PATCH64'
