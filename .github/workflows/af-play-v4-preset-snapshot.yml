name: AF Play v4 Preset Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Add preset snapshot feature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings
          mkdir -p composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings
          mkdir -p composeApp/src/iosMain/kotlin/com/nuvio/app/features/settings
          mkdir -p composeApp/src/desktopMain/kotlin/com/nuvio/app/features/settings

          echo 'cGFja2FnZSBjb20ubnV2aW8uYXBwLmZlYXR1cmVzLnNldHRpbmdzCgppbXBvcnQgYW5kcm9pZHguY29tcG9zZS5ydW50aW1lLkNvbXBvc2FibGUKCkBDb21wb3NhYmxlCmludGVybmFsIGV4cGVjdCBmdW4gQWZQbGF5UHJlc2V0U2VjdGlvbihpc1RhYmxldDogQm9vbGVhbikK' | base64 -d > composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.kt
          echo '' | base64 -d > composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt
          echo 'cGFja2FnZSBjb20ubnV2aW8uYXBwLmZlYXR1cmVzLnNldHRpbmdzCgppbXBvcnQgYW5kcm9pZHguY29tcG9zZS5ydW50aW1lLkNvbXBvc2FibGUKCkBDb21wb3NhYmxlCmludGVybmFsIGFjdHVhbCBmdW4gQWZQbGF5UHJlc2V0U2VjdGlvbihpc1RhYmxldDogQm9vbGVhbikgPSBVbml0Cg==' | base64 -d > composeApp/src/iosMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.ios.kt
          echo 'cGFja2FnZSBjb20ubnV2aW8uYXBwLmZlYXR1cmVzLnNldHRpbmdzCgppbXBvcnQgYW5kcm9pZHguY29tcG9zZS5ydW50aW1lLkNvbXBvc2FibGUKCkBDb21wb3NhYmxlCmludGVybmFsIGFjdHVhbCBmdW4gQWZQbGF5UHJlc2V0U2VjdGlvbihpc1RhYmxldDogQm9vbGVhbikgPSBVbml0Cg==' | base64 -d > composeApp/src/desktopMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.desktop.kt
          echo '' | base64 -d > /tmp/afplay_patch.py
          python3 /tmp/afplay_patch.py

      - name: Embed exported preset if uploaded
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p androidApp/src/main/assets
          git fetch origin enhanced --depth=1
          if git cat-file -e origin/enhanced:preset/AF-Play-Preset.json 2>/dev/null; then
            git show origin/enhanced:preset/AF-Play-Preset.json > androidApp/src/main/assets/afplay-preset.json
            echo "Preset embedded."
          else
            echo "No preset uploaded yet. Building export-capable APK."
          fi

      - name: Commit feature source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.kt             composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt             composeApp/src/iosMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.ios.kt             composeApp/src/desktopMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.desktop.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/AdvancedSettingsPage.kt             composeApp/src/androidMain/kotlin/com/nuvio/app/MainActivity.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/core/auth/AuthRepository.kt             iosApp/Configuration/Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "AF Play: add preset snapshot export and bootstrap"
            git push origin HEAD:af-play
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable AF Play signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play
        shell: bash
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.4.0"             --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-v0.4-Preset-Snapshot-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-v0.4-Preset-Snapshot-arm64
          path: out/AF-Play-v0.4-Preset-Snapshot-arm64-v8a-debug.apk
          if-no-files-found: error
