          def patch_repository(path: Path):
              text = path.read_text(encoding="utf-8")

              # PlayerStreamsRepository lives in a different package than the
              # FileList provider. Add the four imports it needs before patching.
              if path.name == "PlayerStreamsRepository.kt":
