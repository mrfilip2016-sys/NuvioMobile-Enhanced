      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AF Play 0.6.3
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          set +e
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.6.3"             --stacktrace             --console=plain             --no-daemon 2>&1 | tee "$RUNNER_TEMP/afplay-gradle.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            echo
            echo "========== AF PLAY COMPILER ERRORS =========="
            grep -E '(^e: |error: |Unresolved reference|Compilation error|FAILED)' "$RUNNER_TEMP/afplay-gradle.log" | tail -n 120 || true
            echo "============================================="
            exit "$status"
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-0.6.3-FileList-PRESET-COMPLETE-v10-arm64.apk
          ls -lh out/AF-Play-0.6.3-FileList-PRESET-COMPLETE-v10-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AF-Play-0.6.3-FileList-PRESET-COMPLETE-v10-arm64
          path: out/AF-Play-0.6.3-FileList-PRESET-COMPLETE-v10-arm64.apk
          if-no-files-found: error
          retention-days: 14
