      - name: Use FileList torrent metadata directly
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path(".")

          provider_path = root / (
              "composeApp/src/androidMain/kotlin/com/nuvio/app/features/streams/"
              "FileListProvider.android.kt"
          )
          provider = provider_path.read_text(encoding="utf-8")

          import_anchor = "import java.util.Locale\n"
          cache_import = "import java.util.concurrent.ConcurrentHashMap\n"
          if cache_import not in provider:
              if import_anchor not in provider:
                  raise SystemExit("FileList Locale import anchor not found")
              provider = provider.replace(import_anchor, import_anchor + cache_import, 1)

          cache_object = (
              "internal object FileListTorrentCache {\n"
              "    private const val MAX_ENTRIES = 24\n"
              "    private val torrents = ConcurrentHashMap<String, ByteArray>()\n"
              "\n"
              "    fun put(infoHash: String, bytes: ByteArray) {\n"
              "        if (bytes.isEmpty()) return\n"
              "        val key = infoHash.trim().lowercase(Locale.US)\n"
              "        torrents[key] = bytes.copyOf()\n"
              "        while (torrents.size > MAX_ENTRIES) {\n"
              "            val victim = torrents.keys.firstOrNull() ?: break\n"
              "            torrents.remove(victim)\n"
              "        }\n"
              "    }\n"
              "\n"
              "    fun get(infoHash: String): ByteArray? =\n"
              "        torrents[infoHash.trim().lowercase(Locale.US)]?.copyOf()\n"
              "}\n"
              "\n"
          )

          cache_anchor = "internal actual fun isFileListConfigured(): Boolean =\n"
          if "internal object FileListTorrentCache" not in provider:
              if cache_anchor not in provider:
                  raise SystemExit("FileList cache insertion anchor not found")
              provider = provider.replace(cache_anchor, cache_object + cache_anchor, 1)

          if "FileListTorrentCache.put(meta.infoHash, torrentResponse.body)" not in provider:
              parse_pos = provider.find("parseTorrentMeta(")
              if parse_pos < 0:
                  raise SystemExit("parseTorrentMeta call not found in FileList provider")
              end_marker = "}.getOrNull() ?: continue"
              end_pos = provider.find(end_marker, parse_pos)
              if end_pos < 0:
                  raise SystemExit("parseTorrentMeta result marker not found")
              line_end = provider.find("\n", end_pos)
              if line_end < 0:
                  line_end = len(provider)
              line_start = provider.rfind("\n", 0, end_pos) + 1
              indent = provider[line_start:end_pos]
              insertion = (
                  "\n" + indent +
                  "FileListTorrentCache.put(meta.infoHash, torrentResponse.body)"
              )
              provider = provider[:line_end] + insertion + provider[line_end:]

          provider_path.write_text(provider, encoding="utf-8")

          engine_path = root / (
              "composeApp/src/androidMain/kotlin/com/nuvio/app/features/p2p/"
              "P2pStreamingEngine.android.kt"
          )
          engine = engine_path.read_text(encoding="utf-8")

          engine_import_anchor = "import com.nuvio.engine.NuvioUploadMode\n"
          cache_engine_import = "import com.nuvio.app.features.streams.FileListTorrentCache\n"
          if cache_engine_import not in engine:
              if engine_import_anchor not in engine:
                  raise SystemExit("P2P engine import anchor not found")
              engine = engine.replace(
                  engine_import_anchor,
                  engine_import_anchor + cache_engine_import,
                  1,
              )

          old_block = (
              "            val torrentId = if (reusedTorrent) {\n"
              "                canonicalHash\n"
              "            } else {\n"
              "                resolvedEngine.addMagnet(magnetUri).also { knownTorrentIds += it }\n"
              "            }\n"
          )
          new_block = (
              "            val cachedTorrentData = FileListTorrentCache.get(canonicalHash)\n"
              "            val torrentId = if (reusedTorrent) {\n"
              "                canonicalHash\n"
              "            } else if (cachedTorrentData != null) {\n"
              "                Log.i(\n"
              "                    DIAGNOSTIC_TAG,\n"
              "                    \"start request=$requestSequence phase=${phase.get()} source=filelist_torrent \" +\n"
              "                        \"bytes=${cachedTorrentData.size}\",\n"
              "                )\n"
              "                resolvedEngine.addTorrent(cachedTorrentData).also { knownTorrentIds += it }\n"
              "            } else {\n"
              "                resolvedEngine.addMagnet(magnetUri).also { knownTorrentIds += it }\n"
              "            }\n"
          )
          if "source=filelist_torrent" not in engine:
              if old_block not in engine:
                  raise SystemExit("P2P addMagnet block not found")
              engine = engine.replace(old_block, new_block, 1)

          engine_path.write_text(engine, encoding="utf-8")
          print("FileList .torrent bytes now feed Nuvio Engine directly.")
          PY

          grep -F 'internal object FileListTorrentCache' composeApp/src/androidMain/kotlin/com/nuvio/app/features/streams/FileListProvider.android.kt
          grep -F 'FileListTorrentCache.put(meta.infoHash, torrentResponse.body)' composeApp/src/androidMain/kotlin/com/nuvio/app/features/streams/FileListProvider.android.kt
          grep -F 'import com.nuvio.app.features.streams.FileListTorrentCache' composeApp/src/androidMain/kotlin/com/nuvio/app/features/p2p/P2pStreamingEngine.android.kt
          grep -F 'resolvedEngine.addTorrent(cachedTorrentData)' composeApp/src/androidMain/kotlin/com/nuvio/app/features/p2p/P2pStreamingEngine.android.kt
          grep -F 'source=filelist_torrent' composeApp/src/androidMain/kotlin/com/nuvio/app/features/p2p/P2pStreamingEngine.android.kt


      - name: Stabilize FileList visibility and loading
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path(".")

          provider_path = root / (
              "composeApp/src/androidMain/kotlin/com/nuvio/app/features/streams/"
              "FileListProvider.android.kt"
          )
          provider = provider_path.read_text(encoding="utf-8")

          replacements = [
              ("private const val MAX_FILELIST_RESULTS = 20",
               "private const val MAX_FILELIST_RESULTS = 6"),
              ("connection.connectTimeout = 12_000",
               "connection.connectTimeout = 8_000"),
              ("connection.readTimeout = 20_000",
               "connection.readTimeout = 10_000"),
              ("if (searchResponse.code == 404) return@withContext emptyList()",
               'if (searchResponse.code == 404) error("FileList: niciun rezultat pentru acest titlu")'),
          ]

          for old, new in replacements:
