          grep -F 'group.addonId == FILELIST_ADDON_ID' composeApp/src/commonMain/kotlin/com/nuvio/app/features/streams/StreamsScreen.kt


      - name: Make AF Play preset export complete
        shell: bash
        run: |
          set -euo pipefail

          # Use the newly exported preset as the bundled baseline for fresh installs.
          printf '%s' '' | base64 --decode > composeApp/src/androidMain/assets/afplay-preset.json

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt")
          text = path.read_text(encoding="utf-8")

          # Expand the preset to settings stores that were previously omitted.
          old_files = """    private val preferenceFiles = listOf(
                  "nuvio_theme_settings",
                  "nuvio_home_catalog_settings",
                  "nuvio_player_settings",
                  "nuvio_library_display_settings",
                  "nuvio_continue_watching_preferences",
                  "nuvio_stream_badge_settings",
                  "nuvio_poster_card_style",
                  "nuvio_discover_selection",
                  "nuvio_addons",
                  "nuvio_live_tv",
                  "nuvio_plugins",
              )"""

          new_files = """    private val preferenceFiles = listOf(
                  "nuvio_theme_settings",
                  "nuvio_home_catalog_settings",
                  "nuvio_player_settings",
                  "nuvio_library_display_settings",
                  "nuvio_continue_watching_preferences",
                  "nuvio_stream_badge_settings",
                  "nuvio_poster_card_style",
                  "nuvio_discover_selection",
                  "nuvio_meta_screen_settings",
                  "nuvio_tmdb_settings",
                  "nuvio_omdb_settings",
                  "nuvio_mdblist_settings",
                  "torrent_settings",
                  "nuvio_downloads_settings",
                  "nuvio_collection_mobile_settings",
                  "nuvio_sentry_settings",
                  "nuvio_addons",
                  "nuvio_live_tv",
                  "nuvio_plugins",
              )"""

          if old_files not in text:
              raise SystemExit("Preset preferenceFiles block not found")
          text = text.replace(old_files, new_files, 1)

          # TMDB/OMDb are explicitly requested as part of the user's portable preset.
          # Other password/token/credential fields remain excluded.
          text = text.replace(
              "if (!isSafeKey(key)) return@forEach",
              "if (!isSafeKey(prefsName, key)) return@forEach",
              1,
          )
          text = text.replace(
              "if (!isSafeKey(key)) continue",
              "if (!isSafeKey(prefsName, key)) continue",
              1,
          )

          old_safe = """    private fun isSafeKey(key: String): Boolean {
                  val lowered = key.lowercase()
                  return deniedKeyParts.none { it in lowered }
              }"""
          new_safe = """    private fun isSafeKey(prefsName: String, key: String): Boolean {
                  val lowered = key.lowercase()
                  if (prefsName == "nuvio_tmdb_settings" && "tmdb_api_key" in lowered) return true
                  if (prefsName == "nuvio_omdb_settings" && "omdb_api_key" in lowered) return true
                  return deniedKeyParts.none { it in lowered }
              }"""

          if old_safe not in text:
              raise SystemExit("Preset isSafeKey block not found")
          text = text.replace(old_safe, new_safe, 1)

          path.write_text(text, encoding="utf-8")
          print("Preset export now includes TMDB, OMDb and additional app settings.")
          PY

          grep -F '"nuvio_tmdb_settings"' composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt
          grep -F '"nuvio_omdb_settings"' composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt
          grep -F '"nuvio_meta_screen_settings"' composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/AfPlayPresetSection.android.kt
