                      "import com.nuvio.app.features.streams.isFileListConfigured",
                  ]
                  missing_imports = [line for line in required_imports if line not in text]
                  if missing_imports:
                      package_line = "package com.nuvio.app.features.player\n"
                      if package_line not in text:
                          raise SystemExit(f"Player package anchor not found in {path}")
                      text = text.replace(
                          package_line,
                          package_line + "\n" + "\n".join(missing_imports) + "\n",
                          1,
                      )

              provider_marker = "val pluginProviderGroups = pluginScrapers.toPluginProviderGroups("
              marker_pos = text.find(provider_marker)
              if marker_pos < 0:
                  raise SystemExit(f"Provider declaration not found in {path}")

              line_start = text.rfind("\n", 0, marker_pos) + 1
              indent = text[line_start:marker_pos]
              open_pos = text.find("(", marker_pos)
              if open_pos < 0:
                  raise SystemExit(f"Provider call opening parenthesis not found in {path}")

              depth = 0
              close_pos = -1
              for i in range(open_pos, len(text)):
                  ch = text[i]
                  if ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                      if depth == 0:
                          close_pos = i
                          break
              if close_pos < 0:
                  raise SystemExit(f"Provider call closing parenthesis not found in {path}")

              line_end = text.find("\n", close_pos)
              if line_end < 0:
                  line_end = len(text)
              insertion = f"\n{indent}val fileListEnabled = isFileListConfigured()"
              if "val fileListEnabled = isFileListConfigured()" not in text:
                  text = text[:line_end] + insertion + text[line_end:]

              text = text.replace(
                  "if (installedAddons.isEmpty() && pluginProviderGroups.isEmpty()) {",
                  "if (installedAddons.isEmpty() && pluginProviderGroups.isEmpty() && !fileListEnabled) {",
              )
              text = text.replace(
                  "if (streamAddons.isEmpty() && pluginProviderGroups.isEmpty()) {",
                  "if (streamAddons.isEmpty() && pluginProviderGroups.isEmpty() && !fileListEnabled) {",
              )

              text = text.replace(
                  "val installedAddonOrder = streamAddons.map { it.addonName }",
                  "val installedAddonOrder = streamAddons.map { it.addonName } + if (fileListEnabled) listOf(FILELIST_ADDON_NAME) else emptyList()",
              )

              initial_pattern = re.compile(
                  r'''        val initialGroups = StreamAutoPlaySelector\.orderAddonStreams\(streamAddons\.map \{ addon ->.*?        val isInitiallyLoading = initialGroups\.any \{ it\.isLoading \}''',
                  re.S,
              )
              initial_replacement = '''        val initialGroupsRaw = streamAddons.map { addon ->
                      AddonStreamGroup(
                          addonName = addon.addonName,
                          addonId = addon.addonId,
                          streams = emptyList(),
                          isLoading = true,
                      )
                  } + pluginProviderGroups.map { providerGroup ->
                      AddonStreamGroup(
                          addonName = providerGroup.addonName,
                          addonId = providerGroup.addonId,
                          streams = emptyList(),
                          isLoading = true,
                      )
                  } + if (fileListEnabled) {
                      listOf(
                          AddonStreamGroup(
                              addonName = FILELIST_ADDON_NAME,
                              addonId = FILELIST_ADDON_ID,
                              streams = emptyList(),
                              isLoading = true,
                          )
                      )
                  } else {
                      emptyList()
                  }
                  val initialGroups = StreamAutoPlaySelector.orderAddonStreams(
                      groups = initialGroupsRaw,
                      installedOrder = installedAddonOrder,
                  )
                  val isInitiallyLoading = initialGroups.any { it.isLoading }'''.replace("\n          ", "\n")
              text, count = initial_pattern.subn(initial_replacement, text)
              if count != 1:
                  raise SystemExit(f"Expected one initialGroups block in {path}, found {count}")

              text = text.replace(
                  "val installedAddonIds = streamAddons.map { it.addonId }.toSet()",
                  "val installedAddonIds = streamAddons.map { it.addonId }.toSet() + if (fileListEnabled) setOf(FILELIST_ADDON_ID) else emptySet()",
              )

              total_pattern = re.compile(
                  r'''val totalTasks = streamAddons\.size \+\s*pluginProviderGroups\.sumOf \{ it\.scrapers\.size \}'''
              )
              text, count = total_pattern.subn(
                  "val totalTasks = streamAddons.size +\n"
                  "                pluginProviderGroups.sumOf { it.scrapers.size } +\n"
                  "                if (fileListEnabled) 1 else 0",
                  text,
              )
              if count != 1:
                  raise SystemExit(f"Expected one totalTasks in {path}, found {count}")

              filelist_launch = '''            if (fileListEnabled) {
                      launch {
                          val group = runCatching {
                              fetchFileListStreams(
                                  type = type,
                                  videoId = videoId,
                                  season = season,
                                  episode = episode,
                              )
                          }.fold(
                              onSuccess = { streams ->
                                  AddonStreamGroup(
                                      addonName = FILELIST_ADDON_NAME,
                                      addonId = FILELIST_ADDON_ID,
                                      streams = streams,
                                      isLoading = false,
                                  )
                              },
                              onFailure = { error ->
                                  log.w(error) { "FileList provider failed" }
                                  AddonStreamGroup(
                                      addonName = FILELIST_ADDON_NAME,
                                      addonId = FILELIST_ADDON_ID,
                                      streams = emptyList(),
                                      isLoading = false,
                                      error = error.message,
                                  )
                              },
                          )
                          publishCompletion(StreamLoadCompletion.Addon(group))
                      }
                  }

          '''.replace("\n          ", "\n")
              repeat_anchor = "            repeat(totalTasks) {\n"
              if repeat_anchor not in text:
                  raise SystemExit(f"repeat(totalTasks) anchor not found in {path}")
              text = text.replace(repeat_anchor, filelist_launch + repeat_anchor, 1)

              path.write_text(text, encoding="utf-8")

