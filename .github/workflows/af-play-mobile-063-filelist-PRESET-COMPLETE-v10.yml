      - name: Add FileList to torrent sources
        shell: bash
        env:
          FILELIST_USERNAME: ${{ secrets.FILELIST_USERNAME }}
          FILELIST_PASSKEY: ${{ secrets.FILELIST_PASSKEY }}
        run: |
          set -euo pipefail
          test -n "${FILELIST_USERNAME:-}" || { echo "Missing GitHub secret FILELIST_USERNAME"; exit 1; }
          test -n "${FILELIST_PASSKEY:-}" || { echo "Missing GitHub secret FILELIST_PASSKEY"; exit 1; }

          python3 <<'PY'
          from pathlib import Path
          import base64
          import os
          import re

          ROOT = Path(".")
          username_b64 = base64.b64encode(os.environ["FILELIST_USERNAME"].encode("utf-8")).decode("ascii")
          passkey_b64 = base64.b64encode(os.environ["FILELIST_PASSKEY"].encode("utf-8")).decode("ascii")

          common_path = ROOT / "composeApp/src/commonMain/kotlin/com/nuvio/app/features/streams/FileListProvider.kt"
          common_path.parent.mkdir(parents=True, exist_ok=True)
          common_path.write_text(r'''package com.nuvio.app.features.streams

          internal const val FILELIST_ADDON_ID = "addon:filelist:native"
          internal const val FILELIST_ADDON_NAME = "FileList"

          internal expect fun isFileListConfigured(): Boolean

          internal expect suspend fun fetchFileListStreams(
              type: String,
              videoId: String,
              season: Int?,
              episode: Int?,
          ): List<StreamItem>
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

          android_path = ROOT / "composeApp/src/androidMain/kotlin/com/nuvio/app/features/streams/FileListProvider.android.kt"
          android_path.parent.mkdir(parents=True, exist_ok=True)
          android_source = r'''package com.nuvio.app.features.streams

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.security.MessageDigest
          import android.util.Base64
          import java.util.Locale

          private const val FILELIST_USERNAME_B64 = "__USERNAME_B64__"
          private const val FILELIST_PASSKEY_B64 = "__PASSKEY_B64__"
          private const val FILELIST_API = "https://filelist.io/api.php"
          private const val MAX_FILELIST_RESULTS = 20

          private val fileListUsername: String by lazy {
              String(Base64.decode(FILELIST_USERNAME_B64, Base64.NO_WRAP), Charsets.UTF_8)
          }

          private val fileListPasskey: String by lazy {
              String(Base64.decode(FILELIST_PASSKEY_B64, Base64.NO_WRAP), Charsets.UTF_8)
          }

          internal actual fun isFileListConfigured(): Boolean =
              fileListUsername.isNotBlank() && fileListPasskey.isNotBlank()

          internal actual suspend fun fetchFileListStreams(
              type: String,
              videoId: String,
              season: Int?,
              episode: Int?,
          ): List<StreamItem> = withContext(Dispatchers.IO) {
              if (!isFileListConfigured()) return@withContext emptyList()

              val isSeries = type.equals("series", ignoreCase = true) ||
                  type.equals("tv", ignoreCase = true)

              val imdbId = Regex("tt\\d{5,10}", RegexOption.IGNORE_CASE)
                  .find(videoId)
                  ?.value
              val queryType = if (imdbId != null) "imdb" else "name"
              val queryValue = imdbId ?: videoId
              val categories = if (isSeries) {
                  "21,23,27,24,15"
              } else {
                  "1,2,3,4,6,19,20,25,26"
              }

              val params = mutableListOf(
                  "username" to fileListUsername,
                  "passkey" to fileListPasskey,
                  "action" to "search-torrents",
                  "type" to queryType,
                  "query" to queryValue,
                  "category" to categories,
                  "output" to "json",
              )
              if (isSeries && season != null) params += "season" to season.toString()
              if (isSeries && episode != null) params += "episode" to episode.toString()

              val searchUrl = FILELIST_API + "?" + params.joinToString("&") { (key, value) ->
                  "${urlEncode(key)}=${urlEncode(value)}"
              }

              val searchResponse = httpGet(searchUrl)
              if (searchResponse.code == 404) return@withContext emptyList()
              if (searchResponse.code == 429) error("FileList: limita API a fost atinsa")
              if (searchResponse.code !in 200..299) {
                  error("FileList API HTTP ${searchResponse.code}")
              }

              val candidates = parseSearchResults(searchResponse.body.toString(Charsets.UTF_8))
                  .sortedByDescending { it.optInt("seeders", 0) }
                  .take(MAX_FILELIST_RESULTS)

              buildList {
                  for (item in candidates) {
                      val torrentName = item.optString("name").trim()
                      val downloadUrl = item.optString("download_link")
                          .replace("&amp;", "&")
                          .trim()
                      if (torrentName.isBlank() || downloadUrl.isBlank()) continue

                      val torrentResponse = runCatching { httpGet(downloadUrl) }.getOrNull() ?: continue
                      if (torrentResponse.code !in 200..299 || torrentResponse.body.isEmpty()) continue

                      val meta = runCatching {
                          parseTorrentMeta(
                              bytes = torrentResponse.body,
                              season = season,
                              episode = episode,
                          )
                      }.getOrNull() ?: continue

                      val seeders = item.optInt("seeders", 0)
                      val leechers = item.optInt("leechers", 0)
                      val totalSize = item.optLong("size", 0L)
                      val category = item.optString("category").trim()
                      val chosenSize = meta.selectedFileSize ?: totalSize.takeIf { it > 0L }
                      val chosenFilename = meta.selectedFilename ?: torrentName

                      val description = buildString {
                          append("FileList")
                          append(" • ")
                          append(seeders)
                          append(" seed")
                          if (leechers > 0) {
                              append(" / ")
                              append(leechers)
                              append(" peer")
                          }
                          if (chosenSize != null && chosenSize > 0) {
                              append(" • ")
                              append(formatBytes(chosenSize))
                          }
                          if (category.isNotBlank()) {
                              append(" • ")
                              append(category)
                          }
                      }

                      add(
                          StreamItem(
                              name = torrentName,
                              title = torrentName,
                              description = description,
                              infoHash = meta.infoHash,
                              fileIdx = meta.fileIndex,
                              sources = meta.trackers.map { "tracker:$it" },
                              sourceName = FILELIST_ADDON_NAME,
                              addonName = FILELIST_ADDON_NAME,
                              addonId = FILELIST_ADDON_ID,
                              streamType = "torrent",
                              behaviorHints = StreamBehaviorHints(
                                  videoSize = chosenSize,
                                  filename = chosenFilename,
                              ),
                          )
                      )
                  }
              }
          }

          private data class HttpResult(
              val code: Int,
              val body: ByteArray,
          )

          private fun httpGet(url: String): HttpResult {
              val connection = URL(url).openConnection() as HttpURLConnection
              connection.requestMethod = "GET"
              connection.instanceFollowRedirects = true
              connection.connectTimeout = 12_000
              connection.readTimeout = 20_000
              connection.setRequestProperty("Accept", "*/*")
              connection.setRequestProperty("User-Agent", "AFPlay/0.6.3 Android")
              return try {
                  val code = connection.responseCode
                  val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                  HttpResult(code, stream?.use { it.readBytes() } ?: ByteArray(0))
              } finally {
                  connection.disconnect()
              }
          }

          private fun parseSearchResults(body: String): List<JSONObject> {
              if (body.isBlank()) return emptyList()
              val value = JSONTokener(body).nextValue()
              val array = when (value) {
                  is JSONArray -> value
                  is JSONObject -> value.optJSONArray("torrent_results")
                      ?: value.optJSONArray("results")
                      ?: value.optJSONArray("torrents")
                      ?: JSONArray()
                  else -> JSONArray()
              }
              return buildList {
                  for (i in 0 until array.length()) {
                      array.optJSONObject(i)?.let(::add)
                  }
              }
          }

          private data class TorrentMeta(
              val infoHash: String,
              val trackers: List<String>,
              val fileIndex: Int?,
              val selectedFilename: String?,
              val selectedFileSize: Long?,
          )

          private data class BResult(
              val value: Any?,
              val next: Int,
          )

          private class BDecoder(private val data: ByteArray) {
              fun parse(index: Int): BResult {
                  require(index in data.indices) { "Bencode index out of range" }
                  return when (val marker = data[index].toInt().toChar()) {
                      'i' -> parseInteger(index)
                      'l' -> parseList(index)
                      'd' -> parseDictionary(index)
                      in '0'..'9' -> parseBytes(index)
                      else -> error("Invalid bencode marker: $marker")
                  }
              }

              fun parseBytes(index: Int): BResult {
                  var p = index
                  var length = 0
                  while (p < data.size && data[p].toInt().toChar() != ':') {
                      val c = data[p].toInt().toChar()
                      require(c in '0'..'9') { "Invalid bencode string length" }
                      length = length * 10 + (c - '0')
                      p++
                  }
                  require(p < data.size && data[p].toInt().toChar() == ':')
                  val start = p + 1
                  val end = start + length
                  require(end <= data.size) { "Bencode string overflow" }
                  return BResult(data.copyOfRange(start, end), end)
              }

              private fun parseInteger(index: Int): BResult {
                  val end = findByte('e'.code.toByte(), index + 1)
                  val number = data.copyOfRange(index + 1, end)
                      .toString(Charsets.US_ASCII)
                      .toLong()
                  return BResult(number, end + 1)
              }

              private fun parseList(index: Int): BResult {
                  val list = mutableListOf<Any?>()
                  var p = index + 1
                  while (p < data.size && data[p].toInt().toChar() != 'e') {
                      val result = parse(p)
                      list += result.value
                      p = result.next
                  }
                  require(p < data.size) { "Unterminated bencode list" }
                  return BResult(list, p + 1)
              }

              private fun parseDictionary(index: Int): BResult {
                  val map = linkedMapOf<String, Any?>()
                  var p = index + 1
                  while (p < data.size && data[p].toInt().toChar() != 'e') {
                      val key = parseBytes(p)
                      val keyText = (key.value as ByteArray).toString(Charsets.UTF_8)
                      val value = parse(key.next)
                      map[keyText] = value.value
                      p = value.next
                  }
                  require(p < data.size) { "Unterminated bencode dictionary" }
                  return BResult(map, p + 1)
              }

              private fun findByte(target: Byte, start: Int): Int {
                  for (i in start until data.size) {
                      if (data[i] == target) return i
                  }
                  error("Bencode terminator not found")
              }
          }

          private fun parseTorrentMeta(
              bytes: ByteArray,
              season: Int?,
              episode: Int?,
          ): TorrentMeta {
              require(bytes.isNotEmpty() && bytes[0].toInt().toChar() == 'd') {
                  "Torrent root is not a dictionary"
              }

              val decoder = BDecoder(bytes)
              val root = linkedMapOf<String, Any?>()
              var p = 1
              var infoStart = -1
              var infoEnd = -1

              while (p < bytes.size && bytes[p].toInt().toChar() != 'e') {
                  val keyResult = decoder.parseBytes(p)
                  val key = (keyResult.value as ByteArray).toString(Charsets.UTF_8)
                  val valueStart = keyResult.next
                  val valueResult = decoder.parse(valueStart)
                  root[key] = valueResult.value
                  if (key == "info") {
                      infoStart = valueStart
                      infoEnd = valueResult.next
                  }
                  p = valueResult.next
              }

              require(infoStart >= 0 && infoEnd > infoStart) { "Torrent has no info dictionary" }
              val infoHash = sha1Hex(bytes.copyOfRange(infoStart, infoEnd))
              @Suppress("UNCHECKED_CAST")
              val info = root["info"] as? Map<String, Any?> ?: emptyMap()

              val trackers = linkedSetOf<String>()
              root["announce"].asUtf8()?.trim()?.takeIf { it.isNotEmpty() }?.let(trackers::add)
              val announceList = root["announce-list"] as? List<*>
              announceList.orEmpty().forEach { tier ->
                  when (tier) {
                      is List<*> -> tier.forEach { it.asUtf8()?.trim()?.takeIf(String::isNotEmpty)?.let(trackers::add) }
                      else -> tier.asUtf8()?.trim()?.takeIf(String::isNotEmpty)?.let(trackers::add)
                  }
              }

              val selection = chooseTorrentFile(
                  info = info,
                  season = season,
                  episode = episode,
              )

              return TorrentMeta(
                  infoHash = infoHash,
                  trackers = trackers.toList(),
                  fileIndex = selection?.index,
                  selectedFilename = selection?.path ?: info["name"].asUtf8(),
                  selectedFileSize = selection?.length ?: (info["length"] as? Long),
              )
          }

          private data class TorrentFile(
              val index: Int,
              val path: String,
              val length: Long,
          )

          private fun chooseTorrentFile(
              info: Map<String, Any?>,
              season: Int?,
              episode: Int?,
          ): TorrentFile? {
              val files = (info["files"] as? List<*>)
                  ?.mapIndexedNotNull { index, raw ->
                      @Suppress("UNCHECKED_CAST")
                      val file = raw as? Map<String, Any?> ?: return@mapIndexedNotNull null
                      val pathParts = (file["path"] as? List<*>)
                          .orEmpty()
                          .mapNotNull { it.asUtf8() }
                      val path = pathParts.joinToString("/")
                      val length = file["length"] as? Long ?: 0L
                      if (path.isBlank()) null else TorrentFile(index, path, length)
                  }
                  .orEmpty()

              if (files.isEmpty()) return null

              if (season != null && episode != null) {
                  val sxe = String.format(Locale.US, "S%02dE%02d", season, episode)
                  val x = String.format(Locale.US, "%02dX%02d", season, episode)
                  files.firstOrNull { file ->
                      val upper = file.path.uppercase(Locale.US)
                      upper.contains(sxe) || upper.contains(x)
                  }?.let { return it }
              }

              val videoExtensions = setOf(
                  "mkv", "mp4", "avi", "m4v", "mov", "ts", "m2ts", "webm", "wmv"
              )
              return files
                  .filter { file ->
                      file.path.substringAfterLast('.', "").lowercase(Locale.US) in videoExtensions
                  }
                  .maxByOrNull { it.length }
                  ?: files.maxByOrNull { it.length }
          }

          private fun Any?.asUtf8(): String? =
              (this as? ByteArray)?.toString(Charsets.UTF_8)

          private fun sha1Hex(bytes: ByteArray): String =
              MessageDigest.getInstance("SHA-1")
                  .digest(bytes)
                  .joinToString("") { "%02x".format(it.toInt() and 0xff) }

          private fun urlEncode(value: String): String =
              URLEncoder.encode(value, Charsets.UTF_8.name())

          private fun formatBytes(bytes: Long): String {
              if (bytes <= 0L) return "0 B"
              val units = arrayOf("B", "KB", "MB", "GB", "TB")
              var value = bytes.toDouble()
              var unit = 0
              while (value >= 1024.0 && unit < units.lastIndex) {
                  value /= 1024.0
                  unit++
              }
              return if (unit <= 1) {
                  String.format(Locale.US, "%.0f %s", value, units[unit])
              } else {
                  String.format(Locale.US, "%.1f %s", value, units[unit])
              }
          }
