name: AF Play Fire TV Max Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Apply Fire TV compatibility profile
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/afplay_firetv_patch.py
          python3 /tmp/afplay_firetv_patch.py

          mkdir -p androidApp/src/main/res/drawable-nodpi
          cp composeApp/src/commonMain/composeResources/drawable/af_play_wordmark.png              androidApp/src/main/res/drawable-nodpi/af_play_tv_banner.png

      - name: Embed AF Play preset if present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p androidApp/src/main/assets
          git fetch origin enhanced --depth=1
          if git cat-file -e origin/enhanced:preset/AF-Play-Preset.json 2>/dev/null; then
            git show origin/enhanced:preset/AF-Play-Preset.json               > androidApp/src/main/assets/afplay-preset.json
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Fire TV compatibility signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-firetvcompat-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=AF Play Fire TV Compat Debug,O=AF Play,C=IT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal ARM Fire TV APK
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.4.0-tvcompat"             --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-FireTV-Universal-ARM-debug.apk

          for abi in armeabi-v7a arm64-v8a; do
            for lib in libmpv.so libquickjs.so libnuvio_engine.so; do
              unzip -l out/AF-Play-FireTV-Universal-ARM-debug.apk                 | grep -q "lib/$abi/$lib"                 || { echo "Missing $abi/$lib"; exit 1; }
            done
          done

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          "$AAPT" dump badging out/AF-Play-FireTV-Universal-ARM-debug.apk             | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:|launchable-activity:)"             | tee out/firetv-badging.txt

          "$APKSIGNER" verify --verbose --print-certs             out/AF-Play-FireTV-Universal-ARM-debug.apk             | tee out/firetv-signature.txt

      - name: Upload universal Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-FireTV-Universal-ARM
          path: |
            out/AF-Play-FireTV-Universal-ARM-debug.apk
            out/firetv-badging.txt
            out/firetv-signature.txt
          if-no-files-found: error
