      - name: Verify changes
        shell: bash
        run: |
          set -euo pipefail
          CAST="composeApp/src/androidMain/kotlin/com/nuvio/app/features/player/AfPlayCastButton.android.kt"
          MANIFEST="androidApp/src/main/AndroidManifest.xml"
          GATE="composeApp/src/androidMain/kotlin/com/nuvio/app/afplay/AfPlayActivationGate.kt"
          MAIN="composeApp/src/androidMain/kotlin/com/nuvio/app/MainActivity.kt"

          grep -F 'import com.google.android.gms.cast.framework.CastButtonFactory' "$CAST"
          test "$(grep -c 'android:name="com.nuvio.app.launcher.AppIconDefault"' "$MANIFEST")" -eq 1
          ! grep -F 'android:screenOrientation="landscape"' "$MANIFEST"
          grep -F 'SCREEN_ORIENTATION_PORTRAIT' "$GATE"
          grep -F 'Cod de activare' "$GATE"
          ! grep -F 'Introdu codul primit' "$GATE"
          grep -F 'AfPlayActivationGate {' "$MAIN"
          grep -F 'CURRENT_PROJECT_VERSION=265' iosApp/Configuration/Version.xcconfig

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          touch local.properties
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.6.3"             --stacktrace             --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-0.6.3-Portrait-Activation-arm64.apk
          ls -lh out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AF-Play-0.6.3-Portrait-Activation-arm64
          path: out/AF-Play-0.6.3-Portrait-Activation-arm64.apk
          if-no-files-found: error
          retention-days: 14
