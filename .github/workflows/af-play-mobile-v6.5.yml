name: AF Play Mobile - Activation v6.5

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/af-play-mobile-v6.5.yml'

permissions:
  contents: read

concurrency:
  group: af-play-mobile-v6.5.yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AF Play Android Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout NuvioTV
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<'EOF'
          TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
          SIMKL_APP_NAME=afplay
          USE_LOCAL_FFMPEG_DECODER=false
          DOVI_NATIVE_ENABLED=false
          DOVI_EXTRACTOR_HOOK_READY=false
          DOVI_ENABLE_REAL_LINK=false
          SUPPORTERS_API_BASE_URL=https://nuvio.tv/
          SUPPORT_URL=https://nuvio.tv/support
          EOF
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> local.properties
          touch local.dev.properties

      - name: Prepare CI signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/afplay.jks"             -storepass android             -alias afplay             -keypass android             -dname "CN=AF Play,O=AF Studio,C=IT"             -keyalg RSA             -keysize 2048             -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/afplay.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=afplay"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Apply known-good AF Play v6.2 base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re
          src = Path(".github/workflows/af-play-tv-full-v6.2.yml").read_text(encoding="utf-8")
          m = re.search(
              r'''cat > "\$RUNNER_TEMP/afplay_tv_patch\.b64" <<'AFPLAY_PATCH'\n(.*?)\n\s*AFPLAY_PATCH''',
              src,
              flags=re.S,
          )
          if not m:
              raise SystemExit("Nu am găsit patch-ul v6.2")
          encoded = "".join(line.strip() for line in m.group(1).splitlines())
          decoded = base64.b64decode(encoded, validate=True)
          p = Path(os.environ["RUNNER_TEMP"]) / "afplay_v62_patch.py"
          p.write_bytes(decoded)
          compile(decoded.decode("utf-8"), str(p), "exec")
          PY
          python3 "$RUNNER_TEMP/afplay_v62_patch.py"

