      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'https://afplay-gateway.smar7y.workers.dev' app/src/main/java/com/nuvio/tv/afplay/AfPlayGateActivity.kt
          grep -F '.filter { it.isLetterOrDigit() }' app/src/main/java/com/nuvio/tv/afplay/AfPlayGateActivity.kt
          grep -F 'AfPlayGateActivity' app/src/main/java/com/nuvio/tv/launcher/AppIconActivities.kt
          grep -F 'versionName = "6.5-mobile"' app/build.gradle.kts

      - name: Build full debug APKs
        env:
          CI_USE_DEBUG_SIGNING: 'false'
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon --console=plain

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          DIR="app/build/outputs/apk/full/debug"
          UNIVERSAL="$(find "$DIR" -maxdepth 1 -type f -name '*universal*debug*.apk' | head -n 1)"
          test -n "$UNIVERSAL"
          cp "$UNIVERSAL" out/AF-Play-v6.5-Android-Mobile-Universal.apk
          ls -lh out/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: AF-Play-v6.5-Android-Mobile
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
