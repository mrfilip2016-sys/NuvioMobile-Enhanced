name: AF Play v3.1 Preset + Keep Settings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AF Play
        uses: actions/checkout@v4
        with:
          ref: af-play
          fetch-depth: 0

      - name: Apply AF Play preset and preserve local settings on sign-out
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          addon_path = Path("composeApp/src/androidMain/kotlin/com/nuvio/app/features/addons/AddonPlatform.android.kt")
          addon = addon_path.read_text(encoding="utf-8")

          if "defaultAfPlayAddonUrls" not in addon:
              marker = '    private const val addonEnabledStatesKey = "installed_manifest_enabled_states"\n'
              block = '''\n    private val defaultAfPlayAddonUrls = listOf(
              "https://v3-cinemeta.strem.io/manifest.json",
              "https://opensubtitles-v3.strem.io/manifest.json",
          )\n'''
              if marker not in addon:
                  raise SystemExit("AddonStorage marker not found")
              addon = addon.replace(marker, marker + block, 1)

          old_init = '''    fun initialize(context: Context) {
              preferences = context.getSharedPreferences(preferencesName, Context.MODE_PRIVATE)
          }
          '''
          new_init = '''    fun initialize(context: Context) {
              preferences = context.getSharedPreferences(preferencesName, Context.MODE_PRIVATE)

              val prefs = preferences ?: return
              val profileId = 1
              val urlsKey = "${addonUrlsKey}_$profileId"
              if (!prefs.contains(urlsKey)) {
                  prefs.edit()
                      .putString(urlsKey, defaultAfPlayAddonUrls.joinToString(separator = "\\n"))
                      .apply()
              }
          }
          '''
          if old_init in addon:
              addon = addon.replace(old_init, new_init, 1)
          addon_path.write_text(addon, encoding="utf-8")

          theme_path = Path("composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/ThemeSettingsStorage.android.kt")
          theme = theme_path.read_text(encoding="utf-8")

          old_theme_init = '''    fun initialize(context: Context) {
              preferences = context.getSharedPreferences(preferencesName, Context.MODE_PRIVATE)
              applySelectedAppLanguage(loadSelectedAppLanguage() ?: AppLanguage.DEVICE.code)
          }
          '''
          new_theme_init = '''    fun initialize(context: Context) {
              preferences = context.getSharedPreferences(preferencesName, Context.MODE_PRIVATE)
              applyAfPlayDefaultsIfMissing()
              applySelectedAppLanguage(loadSelectedAppLanguage() ?: AppLanguage.DEVICE.code)
          }

              private fun applyAfPlayDefaultsIfMissing() {
                  val prefs = preferences ?: return
                  val editor = prefs.edit()
                  var changed = false

                  val themeKey = ProfileScopedKey.of(selectedThemeKey)
                  if (!prefs.contains(themeKey)) {
                      editor.putString(themeKey, "VIOLET")
                      changed = true
                  }

                  val amoledKey = ProfileScopedKey.of(amoledEnabledKey)
                  if (!prefs.contains(amoledKey)) {
                      editor.putBoolean(amoledKey, true)
                      changed = true
                  }

                  val navStyleKey = ProfileScopedKey.of(NAV_BAR_STYLE_KEY)
                  if (!prefs.contains(navStyleKey)) {
                      editor.putString(navStyleKey, "compact")
                      changed = true
                  }

                  val glowKey = ProfileScopedKey.of(navBarGlowEnabledKey)
                  if (!prefs.contains(glowKey)) {
                      editor.putBoolean(glowKey, true)
                      changed = true
                  }

                  if (changed) editor.apply()
              }
          '''
          if old_theme_init in theme:
              theme = theme.replace(old_theme_init, new_theme_init, 1)
          theme_path.write_text(theme, encoding="utf-8")

          auth_path = Path("composeApp/src/commonMain/kotlin/com/nuvio/app/core/auth/AuthRepository.kt")
          auth = auth_path.read_text(encoding="utf-8")

          old = '''        val localCleanup = runCatching { LocalAccountDataCleaner.wipe() }
              _state.value = AuthState.Unauthenticated

              val failure = anonymousRead.exceptionOrNull()
                  ?: anonymousClear.exceptionOrNull()
                  ?: remoteSignOut.exceptionOrNull()
                  ?: fallbackSessionClear.exceptionOrNull()
                  ?: localCleanup.exceptionOrNull()
          '''
          new = '''        // AF Play: normal sign-out clears only authentication.
              // Local settings, addons, Live TV configuration and appearance stay on this device.
              _state.value = AuthState.Unauthenticated

              val failure = anonymousRead.exceptionOrNull()
                  ?: anonymousClear.exceptionOrNull()
                  ?: remoteSignOut.exceptionOrNull()
                  ?: fallbackSessionClear.exceptionOrNull()
          '''
          if old in auth:
              auth = auth.replace(old, new, 1)
          elif "AF Play: normal sign-out clears only authentication." not in auth:
              raise SystemExit("AuthRepository signOut block not found")
          auth_path.write_text(auth, encoding="utf-8")

          strings_path = Path("composeApp/src/commonMain/composeResources/values/strings.xml")
          strings = strings_path.read_text(encoding="utf-8")
          strings = strings.replace(
              '<string name="compose_about_made_with">Creat cu ❤️ pentru AF Play</string>',
              '<string name="compose_about_made_with">AF Play · configurat și gata de utilizare</string>',
          )
          strings_path.write_text(strings, encoding="utf-8")

          version_path = Path("iosApp/Configuration/Version.xcconfig")
          version = version_path.read_text(encoding="utf-8")
          version = re.sub(r"(?m)^MARKETING_VERSION=.*$", "MARKETING_VERSION=0.3.1", version)
          version = re.sub(r"(?m)^CURRENT_PROJECT_VERSION=.*$", "CURRENT_PROJECT_VERSION=231", version)
          version_path.write_text(version, encoding="utf-8")
          PY

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             composeApp/src/androidMain/kotlin/com/nuvio/app/features/addons/AddonPlatform.android.kt             composeApp/src/androidMain/kotlin/com/nuvio/app/features/settings/ThemeSettingsStorage.android.kt             composeApp/src/commonMain/kotlin/com/nuvio/app/core/auth/AuthRepository.kt             composeApp/src/commonMain/composeResources/values/strings.xml             iosApp/Configuration/Version.xcconfig
          if ! git diff --cached --quiet; then
            git commit -m "AF Play: preset and preserve local settings on sign-out"
            git push origin HEAD:af-play
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable AF Play debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: af-play-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=AF Play Debug,O=AF Play,C=IT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.app.versionName="0.3.1"             --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          apk="$(find androidApp/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" out/AF-Play-v0.3.1-Preset-KeepSettings-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AF-Play-v0.3.1-Preset-KeepSettings-arm64
          path: out/AF-Play-v0.3.1-Preset-KeepSettings-arm64-v8a-debug.apk
          if-no-files-found: error
